<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
  <title>Contact form</title>
</head>
<body>
  <div class="message">
    <div class="message-box">
      <div class="success">
      <img src="./assets/images/icon-success-check.svg"/>
      <p>Message Sent!</p>
      </div>
      <p>Thanks for completing the form.we'll be in touch soon!</p>
    </div>
  </div>
<div class="container">
  <section class="form-section">
    <form class="form-sub">
    <h1>Contact Us</h1>
    <div class="name">
      <div class="form-group">
      <label for="first-name">First Name *</label>
        <input type="text"name="first-name" id="first-name" class="input-field" />
        <span class="error">This field is required</span>
        </div>
        <div class="form-group">
      <label for="last-name">Last Name *</label>
        <input type="text"name="last-name" id="last-name" class="input-field" />
        <span class="error">This field is required</span>
      </div>
      </div>
      <div class="form-group one-line" >
      <label for="email-Address">Email Address *</label>
        <input type="text"name="email" id="email-Address" class="input-field"/>
        <span class="error">Please enter a valid email address</span>
      </div>
      <div class="form-group one-line">
        <p>Query Type *</p>
        <div class="query-group">
        <div class="query-area">
        <label for="generalEnquiry">
        <input type="radio" id="generalEnquiry" name="GeneralEnquiry" value="General Enquiry"/>
        General Enquiry
        </label>
        </div>
        <div class="query-area">
        <label for="supportRequest">
        <input type="radio" id="supportRequest" name="GeneralEnquiry" value="Support Request"/>
        Support Request
        </label>
        </div>
      </div>
      <span class="radio-error">Please select a query type</span>
      </div>
      <div class="form-group one-line" >
      <label for="Message">Message *</label>
        <textarea rows="4" id="Message" name="Message" class="input-field"></textarea>
          <span class="error">This field is required</span>
      </div>
      <div class="form-group one-line">
      <label>
        <input type="checkbox" name="checkbox" id="checkbox" />
       I consent to being contacted by the team *
      </label>
      <span class="check-error">To submit this form, please consent to being contacted</span>
      </div>
      <div class="form-group one-line">
      <button type="submit" class="btn">Submit</button></div>
    </form>
  </section>
  </div>

  <script src="./effect.js"></script>
</body>
</html>
